<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>THE CORE</title>
    <link rel="icon" href="icon.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        body { 
            background-color: #050505; color: #fff; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            user-select: none;
            /* Better global text smoothing */
            -webkit-font-smoothing: antialiased;
        }

        .group-content { 
            display: grid; grid-template-rows: 0fr; opacity: 0; 
            transition: grid-template-rows 0.4s cubic-bezier(0.33, 1, 0.68, 1), opacity 0.3s ease;
        }
        .group-content.open { grid-template-rows: 1fr; opacity: 1; }
        .group-inner { overflow: hidden; }

        /* Fixed Tracking (Spacing) */
        .readable-title { 
            letter-spacing: -0.01em; /* Reduced from -0.05em */
            line-height: 1.4;        /* Added breathing room */
        }
        
        .readable-sub { 
            letter-spacing: 0.02em;  /* Slightly wider for uppercase */
            line-height: 1.2;
        }

        .tag-active { 
            background: #ef4444; 
            color: #fff; 
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }

        .class-row { border-bottom: 1px solid rgba(255,255,255,0.04); }
        .tap-active:active { background-color: rgba(255,255,255,0.06); }
    </style>
</head>
<body class="pb-12">

    <header class="sticky top-0 z-50 bg-black/95 backdrop-blur-xl border-b border-white/5 px-4 py-4">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-1.5 h-5 bg-red-600 rounded-full shadow-[0_0_12px_rgba(220,38,38,0.5)]"></div>
                <h1 class="font-800 text-xl tracking-tight uppercase leading-none flex items-center">
                    <span class="text-white">The</span> <span class="text-red-600 ml-1.5">Core</span>
                </h1>
            </div>
            <button id="masterToggle" onclick="toggleAll()" class="text-[10px] font-800 uppercase tracking-widest text-zinc-400 border border-white/10 h-8 px-3 rounded-lg active:bg-white active:text-black transition-all">
                Expand All
            </button>
        </div>
    </header>

    <main id="app" class="max-w-3xl mx-auto px-3 mt-6 space-y-4"></main>

    <script>
        function renderClass(cls) {
            // Key-agnostic title check to prevent 'undefined'
            const mainTitle = cls.classTitle || "Untitled Chapter";
            const subTitle = (cls.video && (cls.video.videoTitle || cls.video.title)) || "Watch Lesson";
            const videoLink = (cls.video && cls.video.link) || "#";

            const slideButton = cls.slides ? `
                <div class="pl-14 pr-4 pb-4">
                    <a href="${cls.slides.link}" target="_blank" rel="noopener" 
                       class="inline-flex items-center gap-2.5 p-2 px-3 bg-blue-500/10 border border-blue-500/20 rounded-xl active:scale-95 transition-all max-w-full">
                        <svg class="w-3.5 h-3.5 text-blue-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
                        <span class="text-[11px] font-800 text-blue-400 uppercase tracking-wider truncate">${cls.slides.title || 'Chapter Slides'}</span>
                    </a>
                </div>
            ` : '';

            return `
                <div class="class-row">
                    <a href="${videoLink}" target="_blank" rel="noopener" class="tap-active flex items-center gap-4 p-4 group">
                        <div class="shrink-0 w-11 h-11 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center group-active:border-red-500/50 transition-colors shadow-inner">
                            <svg class="w-5 h-5 text-red-600" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                        <div class="flex flex-col min-w-0">
                            <span class="readable-title text-[15px] font-800 text-zinc-100 truncate">${mainTitle}</span>
                            <span class="readable-sub text-[10px] font-700 text-zinc-500 truncate mt-0.5 uppercase">${subTitle}</span>
                        </div>
                    </a>
                    ${slideButton}
                </div>
            `;
        }

        async function init() {
            const app = document.getElementById('app');
            try {
                const res = await fetch('data.json');
                const data = await res.json();

                data.forEach((group, gIdx) => {
                    const sid = `g${gIdx}`;
                    const classes = group.classes || [];
                    const count = classes.length;
                    const tagStyle = count > 0 ? "tag-active" : "bg-zinc-800/50 text-zinc-500";

                    const section = document.createElement('section');
                    section.className = "bg-[#0a0a0a] border border-white/5 rounded-2xl overflow-hidden shadow-lg";
                    section.innerHTML = `
                        <button onclick="toggleGroup('${sid}')" class="w-full flex items-center justify-between p-5 text-left bg-[#0d0d0d] tap-active transition-colors">
                            <div class="flex flex-col min-w-0 mr-4">
                                <h2 class="text-[16px] font-800 text-white uppercase tracking-tight truncate">${group.groupName}</h2>
                                <div class="mt-2">
                                    <span class="${tagStyle} text-[9px] font-900 tracking-wider uppercase px-2.5 py-1 rounded-full">
                                        ${count} ${count === 1 ? 'Class' : 'Classes'}
                                    </span>
                                </div>
                            </div>
                            <svg id="chev-${sid}" class="w-5 h-5 text-zinc-600 shrink-0 transition-transform duration-500" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                                <path d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>
                        <div id="content-${sid}" class="group-content">
                            <div class="group-inner border-t border-white/5">
                                ${count > 0 ? classes.map(cls => renderClass(cls)).join('') : '<div class="py-12 text-center text-zinc-700 text-[10px] font-800 uppercase tracking-widest italic">Coming Soon</div>'}
                            </div>
                        </div>
                    `;
                    app.appendChild(section);
                });
            } catch (e) { console.error(e); }
        }

        function toggleGroup(sid) {
            const el = document.getElementById(`content-${sid}`);
            const chev = document.getElementById(`chev-${sid}`);
            if(!el) return;
            const isOpen = el.classList.toggle('open');
            chev.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
            chev.classList.toggle('text-red-500', isOpen);
        }

        function toggleAll() {
            const contents = document.querySelectorAll('.group-content');
            const isAnyClosed = Array.from(contents).some(c => !c.classList.contains('open'));
            contents.forEach(c => isAnyClosed ? c.classList.add('open') : c.classList.remove('open'));
            document.querySelectorAll('section svg[id^="chev"]').forEach(v => v.style.transform = isAnyClosed ? 'rotate(180deg)' : 'rotate(0deg)');
            document.getElementById('masterToggle').innerText = isAnyClosed ? 'Collapse All' : 'Expand All';
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
